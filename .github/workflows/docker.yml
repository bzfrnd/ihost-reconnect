name: Build iHost Reconnect

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch pinned upstream and apply fix
        run: |
          git init source
          git -C source remote add origin https://github.com/eWeLinkCUBE/cc.ewelink.smart.home.addon.git
          git -C source fetch --depth 1 origin c66a0151e70363131715cbcec69430f442fb009a
          git -C source checkout --detach FETCH_HEAD

          cd source

          git apply --check ../candidate.patch
          git apply ../candidate.patch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test candidate
        working-directory: source
        run: |
          npm install --prefix server --ignore-scripts --no-audit --no-fund
          npm install --prefix server --no-save --ignore-scripts @types/ws@7

          node --test \
            tests/reconnect.cjs \
            tests/oauth.cjs \
            tests/token-refresh.cjs

          server/node_modules/.bin/tsc \
            --noEmit \
            -p server/tsconfig.json

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ihost-reconnect" >> "$GITHUB_ENV"

      - name: Build and push iHost ARMv7 image
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/Dockerfile.candidate

          platforms: linux/arm/v7

          provenance: false
          sbom: false

          outputs: type=image,push=true,oci-mediatypes=false

          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:compat
            ${{ env.IMAGE }}:compat-${{ github.sha }}

      - name: Verify published image
        run: |
          echo "Checking image:"
          echo "$IMAGE:latest"

          docker buildx imagetools inspect "$IMAGE:latest"

          if docker buildx imagetools inspect "$IMAGE:latest" | grep -q "linux/arm/v7"; then
            echo "OK: image contains linux/arm/v7"
          else
            echo "ERROR: linux/arm/v7 image not found"
            exit 1
          fi
