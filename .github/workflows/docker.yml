name: Build iHost Reconnect

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ihost-reconnect

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch pinned upstream and apply fix
        shell: bash
        run: |
          set -euo pipefail

          git init source
          git -C source remote add origin https://github.com/eWeLinkCUBE/cc.ewelink.smart.home.addon.git
          git -C source fetch --depth 1 origin c66a0151e70363131715cbcec69430f442fb009a
          git -C source checkout --detach FETCH_HEAD

          cd source

          echo "Upstream commit:"
          git rev-parse HEAD

          echo "Patch starts with:"
          head -5 ../candidate.patch

          echo "Checking patch..."
          git apply --check --recount ../candidate.patch || true

          echo "Applying patch using 3-way merge..."
          git apply --recount --3way ../candidate.patch

          echo "Patch applied successfully."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install test dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --prefix server \
            --ignore-scripts \
            --no-audit \
            --no-fund

          npm install \
            --prefix server \
            --no-save \
            --ignore-scripts \
            @types/ws@7

      - name: Run reconnect and OAuth tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          node --test \
            tests/reconnect.cjs \
            tests/oauth.cjs \
            tests/token-refresh.cjs

      - name: TypeScript check
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          server/node_modules/.bin/tsc \
            --noEmit \
            -p server/tsconfig.json

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${OWNER}/${IMAGE_NAME}" >> "$GITHUB_ENV"

          echo "Image:"
          echo "ghcr.io/${OWNER}/${IMAGE_NAME}"

      - name: Build and push iHost ARMv7 image
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/Dockerfile.candidate
          platforms: linux/arm/v7
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:compat
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Verify published image
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "================================================"
          echo "Checking:"
          echo "${IMAGE}:latest"
          echo "================================================"
          echo

          docker buildx imagetools inspect "${IMAGE}:latest"

          INSPECT="$(docker buildx imagetools inspect "${IMAGE}:latest")"

          if echo "$INSPECT" | grep -q "linux/arm/v7"; then
            echo "✅ linux/arm/v7 found"
          else
            echo "❌ linux/arm/v7 was not found in the published image."
            exit 1
          fi

      - name: Inspect raw Docker manifest
        shell: bash
        run: |
          set -euo pipefail

          docker buildx imagetools inspect \
            "${IMAGE}:latest" \
            --raw

      - name: Build summary
        shell: bash
        run: |
          echo
          echo "================================================"
          echo "       iHost Reconnect image ready"
          echo "================================================"
          echo
          echo "IMAGE:"
          echo "${IMAGE}:latest"
          echo
          echo "ARCHITECTURE:"
          echo "linux/arm/v7"
          echo
          echo "PORT:"
          echo "8321"
          echo
          echo "NETWORK MODE:"
          echo "host"
          echo
          echo "================================================"
